
global
    log stdout format raw local0
    maxconn 2000

defaults
    log global
    mode tcp
    option tcplog
    option dontlognull

    timeout connect 5s
    timeout client 1m
    timeout server 1m
    timeout check 5s

# =====================================================
# CONEXIONES DE ESCRITURA
# Solo el nodo que sea PRIMARY estará disponible
# =====================================================

frontend postgres_write
    bind *:5435
    default_backend patroni_primary

backend patroni_primary
    mode tcp
    option httpchk GET /primary
    http-check expect status 200

    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions

    server patroni1 patroni1:5432 check port 8008
    server patroni2 patroni2:5432 check port 8008
    server patroni3 patroni3:5432 check port 8008

# =====================================================
# CONEXIONES DE LECTURA
# Solo las réplicas saludables estarán disponibles
# =====================================================

frontend postgres_read
    bind *:5436
    default_backend patroni_replicas

backend patroni_replicas
    mode tcp
    balance roundrobin

    option httpchk GET /replica?lag=1048576
    http-check expect status 200

    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions

    server patroni1 patroni1:5432 check port 8008
    server patroni2 patroni2:5432 check port 8008
    server patroni3 patroni3:5432 check port 8008

# =====================================================
# ESTADISTICAS DE HAPROXY
# =====================================================

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
