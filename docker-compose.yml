
services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:16
    container_name: tpfinalgrupo14-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hia_grupo14
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tpfinalgrupo14-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hia_grupo14"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nodo secundario 2
  postgres2:
    image: postgres:16
    container_name: tpfinalgrupo14-postgres2
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/scripts/replica-entrypoint.sh"]
    environment:
      REPLICATION_USER: ${REPLICATION_USER}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres2_data:/var/lib/postgresql/data
      - ./Cluster-db/scripts/replica-entrypoint.sh:/scripts/replica-entrypoint.sh:ro
    networks:
      - tpfinalgrupo14-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hia_grupo14"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Nodo secundario 3
  postgres3:
    image: postgres:16
    container_name: tpfinalgrupo14-postgres3
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/scripts/replica-entrypoint.sh"]
    environment:
      REPLICATION_USER: ${REPLICATION_USER}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres3_data:/var/lib/postgresql/data
      - ./Cluster-db/scripts/replica-entrypoint.sh:/scripts/replica-entrypoint.sh:ro
    networks:
      - tpfinalgrupo14-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hia_grupo14"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Administrador visual de PostgreSQL
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tpfinalgrupo14-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - tpfinalgrupo14-network
    depends_on:
      postgres:
        condition: service_healthy

  # Servicio automático de backups
  backup:
    image: prodrigestivill/postgres-backup-local:16
    container_name: tpfinalgrupo14-backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: hia_grupo14
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "0 2 * * *"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 0
      BACKUP_KEEP_MONTHS: 0
    volumes:
      - backups_data:/backups
    networks:
      - tpfinalgrupo14-network
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  postgres2_data:
    driver: local
  postgres3_data:
    driver: local
  pgadmin_data:
    driver: local
  backups_data:
    driver: local

networks:
  tpfinalgrupo14-network:
    driver: bridge
