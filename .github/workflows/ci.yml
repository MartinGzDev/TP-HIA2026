
name: CI/CD - TP HIA Grupo 14

on:
  push:
    branches:
      - main
      - feat/dockerizacion

  pull_request:
    branches:
      - main
      - feat/dockerizacion

permissions:
  contents: read

jobs:
  backend:
    name: Backend - Validación
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar sintaxis
        run: node --check index.js

  frontend:
    name: Frontend - Build Angular
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Construir aplicación
        run: npm run build -- --configuration production

  docker:
    name: Docker - Validación y construcción
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Validar Docker Compose
        run: |
          cp .env.example .env
          docker compose config -q

      - name: Construir imagen backend
        run: docker build -t hia-grupo14-backend ./backend

      - name: Construir imagen frontend
        run: docker build -t hia-grupo14-frontend ./frontend

  publish:
    name: CD - Publicar imágenes en GHCR
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - docker

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir nombre de imágenes
        id: image
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Publicar imagen backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.owner }}/hia-grupo14-backend:latest
            ghcr.io/${{ steps.image.outputs.owner }}/hia-grupo14-backend:${{ github.sha }}

      - name: Publicar imagen frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.owner }}/hia-grupo14-frontend:latest
            ghcr.io/${{ steps.image.outputs.owner }}/hia-grupo14-frontend:${{ github.sha }}

  deploy-frontend:
    name: CD - Desplegar frontend en Mac Mini
    runs-on: [self-hosted, macOS, ARM64]
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Actualizar código
        run: |
          cd /Users/dev/documents/hia2026/tp-hia2026
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

      - name: Reconstruir frontend
        run: |
          cd /Users/dev/documents/hia2026/tp-hia2026
          docker compose up -d --build --no-deps frontend
