
name: CI - TP HIA Grupo 14

on:
  push:
    branches:
      - main
      - feat/dockerizacion
  pull_request:
    branches:
      - main
      - feat/dockerizacion

jobs:
  backend:
    name: Backend - Validación
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar sintaxis
        run: node --check index.js

  frontend:
    name: Frontend - Build Angular
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Construir aplicación
        run: npm run build -- --configuration production

  docker:
    name: Docker - Validación y construcción
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Validar Docker Compose
        run: |
          cp .env.example .env
          docker compose config -q

      - name: Construir imagen backend
        run: docker build -t hia-grupo14-backend ./backend

      - name: Construir imagen frontend
        run: docker build -t hia-grupo14-frontend ./frontend
